[project]
name = "pa-co-caregraph"
version = "0.1.0"
description = "A Jac-native verified continuity-of-care graph for synthetic clinician-approved follow-up plans."
entry-point = "main.jac"
kind = "web-app"
jac-version = "0.34.7"

[serve]
port = 8000
base_route_app = "app"

[byllm.model]
default_model = "${PA_CO_AI_MODEL:-gpt-4o-mini}"
api_key = "${PA_CO_AI_API_KEY:-}"

[byllm.call_params]
temperature = 0.0
max_tokens = 1200
timeout = 8.0
max_output_retries = 1

[dependencies]

[dependencies.npm]
jac-client-node = "1.0.7"
"@tanstack/react-form" = "1.33.2"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"

[check.lint]
select = ["default"]

[test]
directory = "tests"
verbose = true
fail_fast = false
max_failures = 1
